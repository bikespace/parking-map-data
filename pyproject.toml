[project]
name = "bikespace-data"
version = "0.1.0"
description = "New BikeSpace Toronto Bicycle Parking Map Data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "geojson>=3.3.0",
    "geopandas>=1.1.4",
    "geopy>=2.4.1",
    "numpy>=2.5.1",
    "overpass>=0.8.2",
    "pandas>=3.0.3",
    "pandera[geopandas]>=0.32.1",
    "pathlib>=1.0.1",
    "progress>=1.6.1",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "tenacity>=9.1.4",
    "tqdm>=4.68.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.156.4", # required for pandera.DataFrameSchema.example
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-branch --cov-report=term-missing:skip-covered -m 'not long'"
markers = [
    "long: marks tests as long-running (deselect with '-m \"not long\"')",
    "uses_external_resources: marks tests that depend on external resources, e.g. OSM Overpass API, City of Toronto Open Data Portal.",
]

[tool.coverage.run]
omit = [
    "src/bikespace_data/bicycle_parking/analysis",
    ]

[tool.coverage.report]
exclude_also = [
    'if __name__ == .__main__.:',
    '@(abc\.)?abstractmethod',
]

[tool.marimo.runtime]
output_max_bytes = 100_000_000
